spring.application.name=portfolio-backend

# Settings come from environment variables. Locally they are read from backend/.env (gitignored);
# on a server, the host sets real environment variables and .env does not exist.
spring.config.import=optional:file:.env[.properties]

# Hosts usually tell the app its port through PORT; locally we use 8081 (8080 is taken on this machine).
server.port=${PORT:8081}

# SSL: locally "prefer" (use it if the server offers it). In production set DB_SSLMODE=verify-full:
# the connection is encrypted AND the server's certificate is checked against Java's trusted
# certificates (that is what DefaultJavaSSLFactory does), so nobody can pretend to be the database.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
