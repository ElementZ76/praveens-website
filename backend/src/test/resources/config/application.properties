# Test-only settings. Spring Boot reads classpath:/config/application.properties after
# classpath:/application.properties, so these values win, but only when tests run
# (this file is on the test classpath only). Every test uses this, whatever runs it
# (Maven or the VS Code test runner), so no test can write to the dev database by accident.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_TEST_NAME:portfolio_test}
